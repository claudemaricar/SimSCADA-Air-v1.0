<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#0b1120; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.7"/>
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
    <marker id="dotBlue" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    </marker>
    <marker id="dotOrange" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
    </marker>
    <marker id="dotGreen" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />

  <!-- Blueprint Pattern -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1600" height="1000" fill="url(#grid)" />
  </g>

  <!-- Top Mockup Window Bar -->
  <rect x="0" y="0" width="1600" height="40" fill="#030712" />
  <circle cx="24" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#f59e0b" />
  <circle cx="60" cy="20" r="5" fill="#10b981" />
  <text x="88" y="25" fill="#94a3b8" font-size="13" font-weight="600">MOCKUP L13: PENGATURAN LEMBAGA &amp; SOP LOKAL (SimSCADA-Air v1.3)</text>
  <rect x="1390" y="9" width="180" height="22" rx="11" fill="#1e293b" />
  <text x="1480" y="24" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">MOCKUP v1.3 · PRD v1.0</text>

  <!-- Standard Tenant Header PRD §6 -->
  <g transform="translate(0, 40)">
    <rect width="1600" height="66" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    
    <!-- Tenant Logo &amp; Name -->
    <g transform="translate(32, 11)">
      <rect width="44" height="44" rx="10" fill="#0284c7" />
      <path d="M 22 10 C 22 10, 14 22, 14 28 A 8 8 0 0 0 30 28 C 30 22, 22 10, 22 10 Z" fill="#ffffff" />
      <text x="56" y="22" fill="#f8fafc" font-size="17" font-weight="700" letter-spacing="0.3">Balai Diklat Air Minum Nusantara</text>
      <text x="56" y="38" fill="#94a3b8" font-size="11" font-weight="500">Didukung oleh <tspan font-weight="700" fill="#38bdf8">SimSCADA-Air</tspan> · Platform Simulator SCADA Air Minum</text>
    </g>

    <!-- User &amp; Role Profile Right -->
    <g transform="translate(1260, 13)">
      <rect width="308" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="20" r="13" fill="#0369a1" />
      <text x="22" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">RO</text>
      <text x="44" y="18" fill="#f1f5f9" font-size="12" font-weight="600">Rina Oktaviani</text>
      <text x="44" y="31" fill="#38bdf8" font-size="10" font-weight="500">Admin Lembaga · Konfigurasi Sistem</text>
      <circle cx="286" cy="20" r="4" fill="#10b981" />
    </g>
  </g>
  <!-- Clean Non-Colliding Title Block -->
  <g transform="translate(32, 120)">
    <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.3">Pengaturan Lembaga, Kebijakan &amp; SOP Lokal</text>
    <text x="0" y="46" fill="#94a3b8" font-size="13">Konfigurasi Tenant PRD §6 &amp; §13: Identitas, Logo, Penanda Tangan, Aksen Piagam, Persetujuan, Papan Peringkat, Ambang Kelulusan &amp; SOP Lokal</text>
  </g>

  <!-- Left Column: Tenant Identity &amp; Certificate Branding PRD §6 &amp; §13 (Width: 750) -->
  <g transform="translate(32, 190)">
    <rect width="750" height="770" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <g transform="translate(32, 26)">
      <text x="0" y="20" fill="#ffffff" font-size="16" font-weight="700">Identitas Lembaga &amp; Kustomisasi Piagam (PRD §6 &amp; §13)</text>
      <text x="0" y="40" fill="#94a3b8" font-size="12">Data resmi yang tampil di header aplikasi, laporan eksekutif, dan piagam kelulusan</text>

      <line x1="0" y1="56" x2="686" y2="56" stroke="#334155" stroke-width="1" />

      <!-- Field 1: Official Name + Logo -->
      <g transform="translate(0, 70)">
        <text x="0" y="16" fill="#e2e8f0" font-size="12" font-weight="700">NAMA RESMI LEMBAGA (TENANT):</text>
        <rect x="0" y="26" width="420" height="42" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="16" y="52" fill="#ffffff" font-size="13">Balai Diklat Air Minum Nusantara (NUS)</text>
        <text x="440" y="16" fill="#e2e8f0" font-size="12" font-weight="700">LOGO LEMBAGA (PNG/SVG):</text>
        <rect x="440" y="26" width="246" height="42" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
        <circle cx="462" cy="47" r="12" fill="#0284c7" /><text x="462" y="52" fill="#fff" font-size="12" text-anchor="middle">💧</text>
        <text x="482" y="45" fill="#ffffff" font-size="11">logo_nusantara.svg</text>
        <text x="482" y="60" fill="#38bdf8" font-size="10">Ganti logo…</text>
      </g>

      <!-- Field 2: Signers PRD §6 (Pimpinan + Instruktur Penilai) -->
      <g transform="translate(0, 150)">
        <text x="0" y="16" fill="#e2e8f0" font-size="12" font-weight="700">PENANDA TANGAN PIAGAM (PRD §6):</text>
        <rect x="0" y="26" width="338" height="56" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="14" y="46" fill="#94a3b8" font-size="10.5">1. Pimpinan Lembaga</text>
        <text x="14" y="68" fill="#ffffff" font-size="12.5" font-weight="600">Dr. Ir. Bambang Sutrisno, M.Eng.</text>
        <text x="324" y="46" fill="#64748b" font-size="10" text-anchor="end">Kepala Balai Diklat</text>
        <rect x="348" y="26" width="338" height="56" rx="6" fill="#0f172a" stroke="#334155" />
        <text x="362" y="46" fill="#94a3b8" font-size="10.5">2. Instruktur Penilai</text>
        <text x="362" y="68" fill="#ffffff" font-size="12.5" font-weight="600">Budi Santoso, S.T.</text>
        <text x="672" y="46" fill="#64748b" font-size="10" text-anchor="end">Instruktur Utama SPAM</text>
      </g>

      <!-- Field 3: Certificate Accent Color Swatches PRD §13 -->
      <g transform="translate(0, 250)">
        <text x="0" y="16" fill="#e2e8f0" font-size="12" font-weight="700">WARNA AKSEN TEMPLAT PIAGAM (PRD §13):</text>
        <g transform="translate(0, 26)">
          <rect width="160" height="40" rx="6" fill="#0c4a6e" stroke="#0284c7" stroke-width="2" />
          <circle cx="24" cy="20" r="10" fill="#0284c7" />
          <text x="44" y="25" fill="#ffffff" font-size="11.5" font-weight="700">Navy Blue ✓</text>
          <rect x="175" width="160" height="40" rx="6" fill="#064e3b" stroke="#059669" />
          <circle cx="199" cy="20" r="10" fill="#059669" />
          <text x="219" y="25" fill="#a7f3d0" font-size="11.5" font-weight="600">Emerald Green</text>
          <rect x="350" width="160" height="40" rx="6" fill="#451a03" stroke="#d97706" />
          <circle cx="374" cy="20" r="10" fill="#d97706" />
          <text x="394" y="25" fill="#fde68a" font-size="11.5" font-weight="600">Classic Gold</text>
          <rect x="525" width="160" height="40" rx="6" fill="#4c0519" stroke="#e11d48" />
          <circle cx="549" cy="20" r="10" fill="#e11d48" />
          <text x="569" y="25" fill="#fecdd3" font-size="11.5" font-weight="600">Ruby Burgundy</text>
        </g>
      </g>

      <!-- Field 4: Mandatory Instructor Approval Switch PRD §13 -->
      <g transform="translate(0, 336)">
        <rect width="686" height="70" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
        <g transform="translate(20, 14)">
          <text x="0" y="16" fill="#ffffff" font-size="13" font-weight="700">Persetujuan instruktur wajib sebelum piagam terbit (PRD §13)</text>
          <text x="0" y="36" fill="#c7d2fe" font-size="11">ON: piagam menunggu persetujuan di L9 (status L8b). OFF: piagam terbit langsung.</text>
          <rect x="580" y="6" width="64" height="32" rx="16" fill="#059669" />
          <circle cx="626" cy="22" r="12" fill="#ffffff" />
          <text x="570" y="26" fill="#34d399" font-size="11" font-weight="800" text-anchor="end">ON</text>
        </g>
      </g>

      <!-- Field 5: Leaderboard Toggle FR-21 -->
      <g transform="translate(0, 418)">
        <rect width="686" height="62" rx="8" fill="#0f172a" stroke="#334155" />
        <g transform="translate(20, 12)">
          <text x="0" y="16" fill="#ffffff" font-size="13" font-weight="700">Papan peringkat peserta (FR-21)</text>
          <text x="0" y="34" fill="#94a3b8" font-size="11">Peserta hanya melihat peringkat di lembaga ini. Nonaktifkan bila menurunkan motivasi.</text>
          <rect x="580" y="4" width="64" height="32" rx="16" fill="#059669" />
          <circle cx="626" cy="20" r="12" fill="#ffffff" />
          <text x="570" y="24" fill="#34d399" font-size="11" font-weight="800" text-anchor="end">ON</text>
        </g>
      </g>

      <!-- Field 6: Passing Threshold Settings PRD §6 -->
      <g transform="translate(0, 496)">
        <text x="0" y="16" fill="#ffffff" font-size="13" font-weight="700">AMBANG KELULUSAN LEMBAGA (PRD §6):</text>
        <g transform="translate(0, 28)">
          <rect width="215" height="70" rx="8" fill="#0f172a" stroke="#1e293b" />
          <text x="14" y="24" fill="#94a3b8" font-size="11">Misi biasa (1★)</text>
          <text x="14" y="52" fill="#38bdf8" font-size="20" font-weight="700">≥ 70 <tspan font-size="11">poin</tspan></text>

          <rect x="235" width="215" height="70" rx="8" fill="#0f172a" stroke="#1e293b" />
          <text x="249" y="24" fill="#94a3b8" font-size="11">Misi Kelulusan</text>
          <text x="249" y="52" fill="#f59e0b" font-size="20" font-weight="700">≥ 80 <tspan font-size="11">poin</tspan></text>

          <rect x="470" width="216" height="70" rx="8" fill="#0f172a" stroke="#1e293b" />
          <text x="484" y="24" fill="#94a3b8" font-size="11">Post-test akhir</text>
          <text x="484" y="52" fill="#34d399" font-size="20" font-weight="700">≥ 70 <tspan font-size="11">poin</tspan></text>
        </g>
        <text x="0" y="118" fill="#64748b" font-size="10.5">Bobot skor 40/25/20/15 dan ambang alarm baku diatur Super Admin; tidak dapat diubah lembaga.</text>
      </g>

      <!-- Save Settings Button -->
      <g transform="translate(0, 636)">
        <rect width="686" height="48" rx="8" fill="url(#primaryGrad)" />
        <text x="343" y="30" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">SIMPAN PENGATURAN LEMBAGA</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Local SOP Notes per Control Point + Alarm Threshold Rule (Width: 750) -->
  <g transform="translate(818, 190)">
    <rect width="750" height="770" rx="14" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    
    <g transform="translate(32, 26)">
      <text x="0" y="20" fill="#ffffff" font-size="16" font-weight="700">Catatan SOP Lokal per Titik Kontrol (PRD §9)</text>
      <text x="0" y="40" fill="#94a3b8" font-size="12">Tambahkan catatan operasional khusus lembaga tanpa mengubah narasi baku Super Admin</text>

      <line x1="0" y1="56" x2="686" y2="56" stroke="#334155" stroke-width="1" />

      <!-- SOP Editor: Dropdown Select Control Point PRD §9 -->
      <g transform="translate(0, 70)">
        <text x="0" y="16" fill="#38bdf8" font-size="12" font-weight="700">PILIH TITIK KONTROL UNTUK DITAMBAHKAN CATATAN SOP LOKAL:</text>
        <rect x="0" y="26" width="686" height="42" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
        <text x="16" y="52" fill="#ffffff" font-size="13" font-weight="700">Flash Mixer Koagulasi (Pembubuhan &amp; Pengaduk Cepat) ▾</text>
      </g>

      <!-- SOP Editor: Local Notes Textarea PRD §9 -->
      <g transform="translate(0, 155)">
        <text x="0" y="16" fill="#e2e8f0" font-size="12" font-weight="700">ISI CATATAN SOP LOKAL (LANGSUNG TAMPIL DI POP-UP L5a):</text>
        <rect x="0" y="26" width="686" height="150" rx="8" fill="#0f172a" stroke="#334155" />
        <text x="16" y="54" fill="#a7f3d0" font-size="12">"Di instalasi latih IPA Balai Nusantara, injeksi koagulan memakai</text>
        <text x="16" y="74" fill="#a7f3d0" font-size="12">dosing pump membran otomatis dengan kalibrasi larutan PAC 10%.</text>
        <text x="16" y="94" fill="#a7f3d0" font-size="12">Batas minimum tangki harian PAC adalah 20% sebelum pengisian ulang."</text>
        <text x="16" y="150" fill="#64748b" font-size="11">Catatan ini otomatis muncul pada pop-up narasi titik kontrol L5a bagi semua peserta Balai Nusantara.</text>
      </g>

      <!-- REMOVAL OF DEFAULT ALARM EDITING NOTICE (CRITICAL PRD REQUIREMENT) -->
      <g transform="translate(0, 350)">
        <rect width="686" height="180" rx="10" fill="#450a0a" opacity="0.3" stroke="#ef4444" stroke-width="1.5" />
        <g transform="translate(20, 20)">
          <text x="0" y="18" fill="#fca5a5" font-size="13" font-weight="700">🔒 AMBANG BATAS ALARM BAKU TERKUNCI (PRD SIMSCADA-AIR v1.0 §6):</text>
          <text x="0" y="42" fill="#ffffff" font-size="12" font-weight="600">Pengeditan ambang alarm baku ditiadakan bagi Admin Lembaga.</text>
          <text x="0" y="62" fill="#cbd5e1" font-size="11.5">Ambang batas alarm baku (Permenkes No. 2/2023) ditetapkan terpusat</text>
          <text x="0" y="80" fill="#cbd5e1" font-size="11.5">oleh Super Admin platform demi menjamin standarisasi uji kompetensi:</text>
          <text x="0" y="102" fill="#38bdf8" font-size="11.5">• Kekeruhan air olahan: Tinggi bila ≥ 3,0 NTU (Auto-clear ≤ 2,7 NTU)</text>
          <text x="0" y="120" fill="#ef4444" font-size="11.5">• Sisa klor: Kritis bila &lt; 0,2 mg/L · Tekanan distribusi: Drop bila &lt; 1,5 bar</text>
          <text x="0" y="140" fill="#a7f3d0" font-size="11">Lembaga tidak dapat mengubah ambang baku ini.</text>
        </g>
      </g>

      <!-- Save SOP Button -->
      <g transform="translate(0, 560)">
        <rect width="686" height="48" rx="8" fill="#065f46" />
        <text x="343" y="30" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">SIMPAN CATATAN SOP KOAGULASI ✓</text>
      </g>
    </g>
  </g>

</svg>