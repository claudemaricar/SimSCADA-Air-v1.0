<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#0b1120; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.6"/>
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.7"/>
    </filter>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.7"/>
    </filter>
    <marker id="dotBlue" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
    </marker>
    <marker id="dotOrange" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1" />
    </marker>
    <marker id="dotGreen" markerWidth="8" markerHeight="8" refX="4" refY="4">
      <circle cx="4" cy="4" r="3.5" fill="#10b981" stroke="#ffffff" stroke-width="1" />
    </marker>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />

  <!-- Blueprint Pattern -->
  <g opacity="0.04" stroke="#38bdf8" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1600" height="1000" fill="url(#grid)" />
  </g>

  <!-- Top Mockup Window Bar -->
  <rect x="0" y="0" width="1600" height="40" fill="#030712" />
  <circle cx="24" cy="20" r="5" fill="#ef4444" />
  <circle cx="42" cy="20" r="5" fill="#f59e0b" />
  <circle cx="60" cy="20" r="5" fill="#10b981" />
  <text x="88" y="25" fill="#94a3b8" font-size="13" font-weight="600">MOCKUP L16: VERIFIKASI PIAGAM PUBLIK (SimSCADA-Air v1.3)</text>
  <rect x="1390" y="9" width="180" height="22" rx="11" fill="#1e293b" />
  <text x="1480" y="24" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">MOCKUP v1.3 · PRD v1.0</text>

  <!-- Public Verification Top Clean Header (No User Login Needed) -->
  <g transform="translate(0, 40)">
    <rect width="1600" height="58" fill="#030712" stroke="#1e293b" stroke-width="1" />
    <g transform="translate(32, 12)">
      <rect width="36" height="36" rx="8" fill="#0284c7" />
      <path d="M 18 8 C 18 8, 12 18, 12 23 A 6 6 0 0 0 24 23 C 24 18, 18 8, 18 8 Z" fill="#ffffff" />
      <text x="48" y="22" fill="#ffffff" font-size="16" font-weight="700">SimSCADA-Air Portal Publik</text>
      <text x="48" y="36" fill="#38bdf8" font-size="10.5">LAYANAN VERIFIKASI KEABSAHAN PIAGAM KELULUSAN OPERATOR AIR MINUM</text>
    </g>
    <rect x="1380" y="14" width="188" height="30" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="1474" y="33" fill="#94a3b8" font-size="11" text-anchor="middle">AKSES PUBLIK (TANPA LOGIN)</text>
  </g>

  <!-- Clean Non-Colliding Title Block -->
  <g transform="translate(32, 104)">
    <text x="0" y="22" fill="#ffffff" font-size="18" font-weight="700" letter-spacing="0.3">Portal Verifikasi Keaslian Piagam Publik</text>
    <text x="0" y="42" fill="#94a3b8" font-size="12">Portal Terbuka Tanpa Login untuk Rekruter, PDAM &amp; Regulator (Sesuai Ketentuan PRD §13)</text>
  </g>

  <!-- Search Card: Input Nomor Piagam PRD §13 -->
  <g transform="translate(32, 160)">
    <rect width="1536" height="85" rx="10" fill="#0f172a" stroke="#334155" />
    <g transform="translate(24, 22)">
      <text x="0" y="26" fill="#ffffff" font-size="13" font-weight="700">MASUKKAN NOMOR REGISTRASI PIAGAM:</text>
      
      <rect x="290" y="2" width="550" height="42" rx="6" fill="#070c18" stroke="#0284c7" stroke-width="1.5" />
      <text x="306" y="28" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">SSA/NUS/2026/0001</text>

      <rect x="860" y="2" width="180" height="42" rx="6" fill="url(#primaryGrad)" />
      <text x="950" y="27" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">🔍 VERIFIKASI SEKARANG</text>
    </g>
  </g>

  <!-- Main Verification Result Card (PRD §13 STRICT SPEC: ONLY REQUIRED FIELDS) -->
  <g transform="translate(32, 265)">
    <rect width="1536" height="580" rx="14" fill="url(#cardGrad)" stroke="#059669" stroke-width="2" />
    
    <g transform="translate(48, 36)">
      <!-- Official Status Badge: SAH &amp; VALID PRD §13 -->
      <g transform="translate(0, 0)">
        <rect width="280" height="44" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2" />
        <circle cx="24" cy="22" r="10" fill="#34d399" />
        <text x="24" y="26" fill="#064e3b" font-size="12" font-weight="900" text-anchor="middle">✓</text>
        <text x="46" y="28" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="0.5">STATUS: SAH / VALID</text>

        <!-- Interactive Simulation Toggle (Sah vs Dicabut) -->
        <rect x="1150" y="4" width="280" height="36" rx="6" fill="#1e293b" stroke="#334155" />
        <text x="1290" y="26" fill="#94a3b8" font-size="11" text-anchor="middle">Simulasi Status: <tspan fill="#ef4444" font-weight="700">Uji Dicabut [Toggle]</tspan></text>
      </g>

      <text x="0" y="80" fill="#ffffff" font-size="22" font-weight="700">Data Terverifikasi di Basis Data SimSCADA-Air</text>
      <text x="0" y="102" fill="#94a3b8" font-size="12.5">Nomor Registrasi Unik: <tspan font-weight="700" fill="#38bdf8">SSA/NUS/2026/0001</tspan> · Diterbitkan oleh Balai Diklat Air Minum Nusantara</text>

      <line x1="0" y1="120" x2="1440" y2="120" stroke="#334155" stroke-width="1" />

      <!-- Clean 5 Data Points Required by PRD §13 &amp; User Prompt (NO NIP, NO DETAILS, NO PDF DOWNLOAD) -->
      <g transform="translate(0, 140)">
        <!-- Field 1: Nama Peserta -->
        <rect width="700" height="75" rx="8" fill="#0f172a" stroke="#1e293b" />
        <text x="20" y="26" fill="#94a3b8" font-size="11" font-weight="700">1. NAMA PESERTA LULUSAN:</text>
        <text x="20" y="52" fill="#ffffff" font-size="18" font-weight="800">ANDI KURNIAWAN</text>

        <!-- Field 2: Lembaga Penerbit -->
        <g transform="translate(740, 0)">
          <rect width="700" height="75" rx="8" fill="#0f172a" stroke="#1e293b" />
          <text x="20" y="26" fill="#94a3b8" font-size="11" font-weight="700">2. LEMBAGA PENYELENGGARA PELATIHAN:</text>
          <text x="20" y="52" fill="#38bdf8" font-size="17" font-weight="700">Balai Diklat Air Minum Nusantara (NUS)</text>
        </g>

        <!-- Field 3: Jalur Pelatihan -->
        <g transform="translate(0, 95)">
          <rect width="700" height="75" rx="8" fill="#0f172a" stroke="#1e293b" />
          <text x="20" y="26" fill="#94a3b8" font-size="11" font-weight="700">3. JALUR PEMBELAJARAN &amp; SPESIALISASI:</text>
          <text x="20" y="52" fill="#ffffff" font-size="17" font-weight="700">Operator Air Minum Terpadu (IPA &amp; Distribusi)</text>
        </g>

        <!-- Field 4: Tanggal Kelulusan -->
        <g transform="translate(740, 95)">
          <rect width="700" height="75" rx="8" fill="#0f172a" stroke="#1e293b" />
          <text x="20" y="26" fill="#94a3b8" font-size="11" font-weight="700">4. TANGGAL KELULUSAN:</text>
          <text x="20" y="52" fill="#ffffff" font-size="17" font-weight="700">28 Oktober 2026</text>
        </g>

        <!-- Field 5: Predikat Kelulusan PRD §13 -->
        <g transform="translate(0, 190)">
          <rect width="700" height="75" rx="8" fill="#0f172a" stroke="#1e293b" />
          <text x="20" y="26" fill="#94a3b8" font-size="11" font-weight="700">5. PREDIKAT KELULUSAN (PRD §13):</text>
          <text x="20" y="52" fill="#f59e0b" font-size="18" font-weight="800">Lulus dengan Pujian</text>
        </g>

        <!-- Field 6: Legalitas Keabsahan -->
        <g transform="translate(740, 190)">
          <rect width="700" height="75" rx="8" fill="#0f172a" stroke="#1e293b" />
          <text x="20" y="26" fill="#94a3b8" font-size="11" font-weight="700">6. STATUS KEABSAHAN &amp; INTEGRITAS:</text>
          <text x="20" y="52" fill="#34d399" font-size="17" font-weight="700">Terdaftar Aktif · Bebas Pencabutan</text>
        </g>
      </g>
    </g>

    <!-- Contoh status dicabut (PRD §13) -->
    <g transform="translate(48, 462)">
      <rect width="1440" height="96" rx="10" fill="#1f0a0a" stroke="#ef4444" stroke-dasharray="6,4" />
      <text x="20" y="28" fill="#fca5a5" font-size="12" font-weight="700">CONTOH TAMPILAN BILA PIAGAM DICABUT (dipicu tombol "Uji Dicabut"):</text>
      <rect x="20" y="44" width="170" height="40" rx="8" fill="#7f1d1d" stroke="#ef4444" />
      <text x="105" y="69" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">✕ DICABUT</text>
      <text x="210" y="60" fill="#fecaca" font-size="12">Nomor SSA/NUS/2026/0007 · Dicabut Admin Lembaga pada 2 November 2026</text>
      <text x="210" y="80" fill="#fca5a5" font-size="12">Alasan tercatat: piagam terbit atas nama peserta yang salah (data diperbaiki, piagam baru diterbitkan).</text>
    </g>
  </g>

  <!-- UN-COVERED MANDATORY DISCLAIMER FOOTER (PRD §13 &amp; User Instruction: Catatan kaki tidak boleh tertutup) -->
  <g transform="translate(32, 870)">
    <rect width="1536" height="85" rx="10" fill="#090d16" stroke="#334155" stroke-width="1.5" />
    <g transform="translate(24, 20)">
      <text x="0" y="18" fill="#f8fafc" font-size="12" font-weight="700">PEMBERITAHUAN HUKUM (PRD §13):</text>
      <text x="0" y="38" fill="#cbd5e1" font-size="12.5" font-weight="600">"Piagam ini menyatakan penyelesaian pelatihan berbasis simulator dan bukan sertifikat kompetensi resmi."</text>
      <text x="0" y="54" fill="#94a3b8" font-size="11">Sertifikasi profesi resmi operator air minum tetap diselenggarakan oleh Lembaga Sertifikasi Profesi (LSP) berlisensi BNSP.</text>
    </g>
  </g>

</svg>