      <rect width="308" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="22" cy="20" r="13" fill="#0369a1" />
      <text x="22" y="24" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">BS</text>
      <text x="44" y="18" fill="#f1f5f9" font-size="12" font-weight="600">Dr. Ir. Bambang Sutrisno, M.Eng.</text>
      <text x="44" y="31" fill="#38bdf8" font-size="10" font-weight="500">Pimpinan Lembaga · Evaluasi Eksekutif</text>
      <circle cx="286" cy="20" r="4" fill="#10b981" />
    </g>
  </g>
  <!-- Clean Non-Colliding Title Block -->
  <g transform="translate(32, 120)">
    <text x="0" y="24" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.3">Dasbor Evaluasi Lembaga &amp; ROI Pelatihan</text>
    <text x="0" y="46" fill="#94a3b8" font-size="13">4 Metrik Kunci Keberhasilan (T1–T4 PRD §3) · Kartu Pemakaian Lisensi &amp; Ekspor Laporan (PRD §12)</text>
