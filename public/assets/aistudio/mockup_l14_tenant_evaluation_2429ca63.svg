        <text x="0" y="76" fill="#cbd5e1" font-size="11">Median mulai jalur hingga piagam terbit</text>
        <text x="0" y="94" fill="#7dd3fc" font-size="10.5">Turun dari orientasi konvensional (±90 hari)</text>
