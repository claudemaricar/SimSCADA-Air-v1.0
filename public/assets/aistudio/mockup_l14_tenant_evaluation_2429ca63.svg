      <text x="0" y="36" fill="#94a3b8" font-size="11.5">Bahan evaluasi materi pengajaran bagi instruktur SPAM</text>

      <line x1="0" y1="48" x2="702" y2="48" stroke="#334155" stroke-width="1" />

      <!-- Mission 1: IPA-06 -->
