        <text x="0" y="40" fill="#ffffff" font-size="20" font-weight="800">46 / 50 <tspan font-size="13" fill="#fbbf24">(92% Terpakai)</tspan></text>
      </g>

      <!-- Metric 2: Sisa Masa Lisensi -->
      <g transform="translate(380, 32)">
