    <text x="1292" y="29" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">📊 Ekspor Excel (.xlsx)</text>

    <rect x="1375" y="9" width="145" height="32" rx="6" fill="#0284c7" />
