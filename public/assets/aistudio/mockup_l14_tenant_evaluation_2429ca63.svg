      <rect x="170" y="26" width="140" height="24" rx="4" fill="#065f46" />
      <text x="240" y="42" fill="#ffffff" font-size="10.5" font-weight="700" text-anchor="middle">TARGET: ≥ 25% (LULUS)</text>
