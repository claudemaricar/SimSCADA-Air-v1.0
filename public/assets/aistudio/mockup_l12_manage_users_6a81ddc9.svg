      <rect x="1200" y="4" width="160" height="34" rx="6" fill="#0284c7" />
      <text x="1280" y="26" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">+ Tambah Pengguna</text>

      <rect x="1372" y="4" width="118" height="34" rx="6" fill="#1e293b" stroke="#0284c7" />
      <text x="1431" y="26" fill="#38bdf8" font-size="12" font-weight="600" text-anchor="middle">⬆ Impor CSV</text>
